# Project knowledge layer (P6-12): learned non-source inventory rules.
# Rules are data; no AI runs at parse or query time. Rules with
# source: human are authored by people and never edited by enrichment.
rules:
- id: ai-vendored-venv
  pattern: .venv/**
  category: vendored
  explanation: A Python virtual environment directory holding installed third-party
    packages, not project source.
  recommendation: Ensure it is gitignored and exclude it from analysis entirely.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - .venv
- id: ai-build-test-output-wrangler
  pattern: .wrangler/**
  category: build_test_output
  explanation: Cloudflare Wrangler's local dev and build cache directory, generated
    when running or building the viewer's Pages deployment.
  recommendation: Gitignore it and exclude it from analysis; it is regenerated on
    every wrangler run.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - .wrangler
  - viewer/.wrangler
- id: ai-build-test-output-egg-info
  pattern: '*.egg-info/**'
  category: build_test_output
  explanation: Setuptools-generated Python package metadata produced by a local build
    or editable install, not authored content.
  recommendation: Gitignore it and exclude it from analysis; it regenerates from pyproject.toml
    on every build.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - solution_explorer.egg-info/PKG-INFO
- id: ai-config-go-mod
  pattern: '**/go.mod'
  category: config
  explanation: A Go module manifest declaring the module path and dependencies, a
    format the analyzer does not parse.
  recommendation: Classify as an unparsed config/manifest file rather than leaving
    it uncategorized.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - tests/fixtures/entities/gosvc/go.mod
  - tests/fixtures/polyglot/services/worker/go.mod
- id: ai-config-gemfile
  pattern: '**/Gemfile'
  category: config
  explanation: A Ruby Bundler manifest listing gem dependencies, a format the analyzer
    does not parse.
  recommendation: Classify as an unparsed config/manifest file rather than leaving
    it uncategorized.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - tests/fixtures/polyglot/libs/rubylib/Gemfile
- id: ai-build-test-output-tsbuildinfo
  pattern: '*.tsbuildinfo'
  category: build_test_output
  explanation: TypeScript's incremental compilation cache, written by tsc to speed
    up subsequent builds.
  recommendation: Gitignore it and exclude it from analysis; it is fully regenerable
    build output.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - viewer/tsconfig.tsbuildinfo
- id: ai-config-solution-explorer-json-example
  pattern: solution-explorer.json.example
  category: config
  explanation: A sample configuration file showing the shape of solution-explorer.json
    for new adopters, not itself live config.
  recommendation: Keep it as a config template excluded from behavioral analysis.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - solution-explorer.json.example
- id: ai-data-solution-explorer
  pattern: .solution-explorer
  category: data
  explanation: This is solution-explorer's own per-repo store directory, holding its
    SQLite fact-store (index.db) and derived rules for the repo being analyzed.
  recommendation: Add it to .gitignore, since it is regenerated by re-running the
    analyzer and should not be committed.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - .solution-explorer
- id: ai-data-arch-baseline
  pattern: .arch-baseline
  category: data
  explanation: This is solution-explorer's own baseline cache directory, holding prior
    architecture.json snapshots and file-index or import-graph caches used for incremental
    and drift comparisons.
  recommendation: Add it to .gitignore, since it is regenerated on each analyzer run
    and is not source the project ships.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - .arch-baseline
- id: ai-vendored-venv-2
  pattern: .venv
  category: vendored
  explanation: This is a Python virtual environment directory holding installed third-party
    packages for local development, analogous to node_modules.
  recommendation: Keep it out of version control and add it to .gitignore, since it
    is reproducible from requirements or pyproject files.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - .venv
- id: ai-build-test-output-wrangler-2
  pattern: .wrangler
  category: build_test_output
  explanation: This is Cloudflare Wrangler's local development and build cache directory
    for Workers and Pages projects.
  recommendation: Add it to .gitignore, since Wrangler regenerates it on every dev
    or build run.
  source: ai-enrichment
  added: '2026-07-20'
  evidence:
  - .wrangler
  - viewer/.wrangler
