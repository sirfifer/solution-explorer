# V8 mobile (vector V8): the source vectors repeated at 390x844 portrait
# plus one landscape width-hungry view; tap targets work; the touch-and-hold
# path is exercised; no horizontal page scroll. Mobile is first-class: a
# feature that only works with a mouse at 1440px is a failing test, not a
# caveat.
# All cases executed against the running UI on 2026-07-21; V8.4 and V8.8
# re-walked 2026-07-22 after the mobile-parity fix. V8.4 (lens switcher) and
# V8.8 (review mode plus the annotation workflow) now assert working mobile
# behavior; they were expected-BLOCKED on the first run and drove the fix.

- id: V8.1
  vector: mobile
  viewport: mobile
  dataset: dogfood
  steps:
    - "Load the app for dataset 'dogfood' and wait until the graph has rendered at least one node"
    - "Click the button labeled 'Skip' in the welcome dialog"
  pass_when:
    - "at least 3 component nodes are visible in the graph"
    - "a bottom navigation bar with Tree, Graph, and Search is visible"
    - "the page does not scroll horizontally"
    - "no unexpected console or network errors during the flow"
  evidence: screenshot+console

- id: V8.2
  vector: mobile
  viewport: mobile
  dataset: dogfood
  steps:
    - "Load the app for dataset 'dogfood' with the query string '?component=analyzer%2Fextract&tab=symbols&drill=root' and wait until the graph has rendered at least one node"
    - "Click the sheet header labeled 'Swipe up for details'"
    - "Swipe up on the bottom sheet drag handle"
    - "Click the symbol named 'ActivityResult' in the symbol list"
  pass_when:
    - "step 2: the bottom sheet opens showing the component detail with its tabs"
    - "step 3: the sheet expands so the symbol list is visible"
    - "step 4: a code preview is visible containing at least 3 lines including 'class ActivityResult' (drill-to-code works on a phone)"
    - "the page does not scroll horizontally"
    - "no unexpected console or network errors during the flow"
  evidence: screenshot

