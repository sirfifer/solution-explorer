# V11 findings and surfaces (vector V11): FindingsSurface,
# SupplyChainSurface, InventoryPanel, CoverageBadge each render their
# dataset section and drill into an entry; ChangelogPanel carries the
# what's-new record. Sampling: two entries each where two exist.
# All cases executed against the running UI on 2026-07-21.

- id: V11.1
  vector: findings-surfaces
  viewport: desktop
  dataset: dogfood
  steps:
    - "Load the app for dataset 'dogfood' and wait until the graph has rendered at least one node"
    - "Click the button labeled 'Skip' in the welcome dialog"
    - "Click the strip labeled 'Review what the system noticed'"
    - "Click the expand arrow on the first duplication finding"
    - "Open the surface tab labeled 'Concerns'"
  pass_when:
    - "the findings strip shows the counts (78 findings, 6 concerns, unverified badge)"
    - "step 3: the surface opens with kind filters (duplication, inconsistency, unreferenced) and a findings list"
    - "step 4: the entry expands to its members, each with a file and line reference"
    - "step 5: the Concerns tab lists 6 concerns including 'Auth' with member counts"
    - "no unexpected console or network errors during the flow"
  evidence: screenshot
  covers:
    - component:FindingsEntry
    - component:FindingsSurface

- id: V11.2
  vector: findings-surfaces
  viewport: desktop
  dataset: dogfood
  steps:
    - "Load the app for dataset 'dogfood' and wait until the graph has rendered at least one node"
    - "Click the button labeled 'Skip' in the welcome dialog"
    - "Click the strip labeled 'Supply chain'"
    - "Click the filter labeled 'direct (50)'"
  pass_when:
    - "the supply chain strip shows dependency totals (569 dependencies, 2 ecosystems)"
    - "step 3: the surface opens with the honest scope note ('Not a vulnerability scan'), language targets, and per-ecosystem dependency lists with source locations"
    - "step 4: the list filters to the 50 direct dependencies"
    - "no unexpected console or network errors during the flow"
  evidence: screenshot
  covers:
    - component:SupplyChainEntry
    - component:SupplyChainSurface

