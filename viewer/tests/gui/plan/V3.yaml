- id: V3.8
  vector: detail-tabs
  viewport: desktop
  dataset: dogfood
  steps:
    - "Load the app for dataset 'dogfood' with the query string '?component=analyzer%2Fextract&drill=root' and wait until the detail panel has rendered"
    - "Open the detail panel tab labeled 'Files'"
    - "Click the file named 'activity.py' in the file list"
    - "Load the app for dataset 'dogfood' with the query string '?component=analyzer%2Fextract&tab=relationships&drill=root' and wait until the detail panel has rendered"
    - "Click the link target named 'parsers' in the relationships list"
  pass_when:
    - "step 1: the Overview tab renders the component's language and file statistics"
    - "step 3: a file detail view opens showing 'analyzer/extract/activity.py' with its line count and FILE DOCUMENTATION text"
    - "step 4: the Links tab lists 'OUTGOING (1)' with target 'parsers' and type 'import'"
    - "step 5: the selection navigates to the 'parsers' component (its detail panel opens)"
    - "no unexpected console or network errors during the flow"
  evidence: screenshot
  covers:
    - tab:overview
    - tab:files
    - tab:relationships
