# V3 detail tabs (vector V3): every tab renders content matching the
# component's data; conditional tabs appear exactly when data exists.
# Sampling rule per tab: the first two components by sorted id carrying the
# tab's data, plus the first component by sorted id without it
# (analyzer/cra, which has no docs, no ai_enhance, no testing, no
# capabilities, no data entities, no actions). Recorded one-sided samples:
# actions has exactly ONE data-bearing component in the dogfood
# (tests/fixtures/polyglot/apps/ios); status has ZERO (no live fixture), so
# V3.7 tests only the conditional-absence half.
# All cases executed against the running UI on 2026-07-21. Walk finding: the
# Docs tab APPEARS for patterns-only components (analyzer) but renders 'No
# documentation files found'; V3.1 asserts the tab's own presence condition
# is matched by content, which is the behavior the design requires.

- id: V3.1
  vector: detail-tabs
  viewport: desktop
  dataset: dogfood
  steps:
    - "Load the app for dataset 'dogfood' with the query string '?component=infrastructure%2Fcloudflare&tab=docs&drill=root' and wait until the detail panel has rendered"
    - "Click the button labeled 'Skip' in the welcome dialog"
    - "Load the app for dataset 'dogfood' with the query string '?component=root&tab=docs&drill=root' and wait until the detail panel has rendered"
    - "Load the app for dataset 'dogfood' with the query string '?component=analyzer&tab=docs&drill=root' and wait until the detail panel has rendered"
    - "Load the app for dataset 'dogfood' with the query string '?component=analyzer%2Fcra&drill=analyzer' and wait until the detail panel has rendered"
  pass_when:
    - "step 1: the Docs tab renders README content including the heading 'Cloudflare Infrastructure for Solution Explorer'"
    - "step 3: the Docs tab renders documentation content of at least 3 lines"
    - "step 4: the Docs tab is present AND renders content matching the component's docs data (analyzer carries one detected pattern); a tab that appears but renders 'No documentation files found' fails this assertion"
    - "step 5: no tab labeled 'Docs' is shown for analyzer/cra"
    - "no unexpected console or network errors during the flow"
  evidence: screenshot
  covers:
    - tab:docs

- id: V3.2
  vector: detail-tabs
  viewport: desktop
  dataset: dogfood
  steps:
    - "Load the app for dataset 'dogfood' with the query string '?component=analyzer&tab=ai&drill=root' and wait until the detail panel has rendered"
    - "Load the app for dataset 'dogfood' with the query string '?component=docs&tab=ai&drill=root' and wait until the detail panel has rendered"
    - "Load the app for dataset 'dogfood' with the query string '?component=analyzer%2Fcra&drill=analyzer' and wait until the detail panel has rendered"
  pass_when:
    - "step 1: the AI Insights tab renders a role badge 'Business Logic', a criticality marker 'critical', and a narrative section 'ABOUT THIS COMPONENT'"
    - "step 1: the WHY / WHO strip above the tabs shows an author, a last-change time, and an 'AI intent' marker"
    - "step 2: the AI Insights tab renders a narrative section with at least 2 lines of text"
    - "step 3: no tab labeled 'AI Insights' is shown for analyzer/cra"
    - "no unexpected console or network errors during the flow"
  evidence: screenshot
  covers:
    - tab:ai
    - subview:structure/rationale

