- id: V4.4
  vector: edge-types
  viewport: desktop
  dataset: dogfood
  steps:
    - "Load the app for dataset 'dogfood' with the query string '?drill=tests%2Ffixtures%2Fstoryboard%2Fapp' and wait until the graph has rendered at least one node"
    - "Click the component node titled 'HomeViewController'"
    - "Click the component node titled 'SettingsViewController'"
  pass_when:
    - "exactly 2 edges render at this drill level (the sampled navigation edge home to detail, and the sampled modal edge home to settings)"
    - "the screen nodes render inside device frames (a phone status bar reading '9:41' is visible on each)"
    - "both sampled endpoints open their detail panels when clicked"
    - "no unexpected console or network errors during the flow"
  evidence: screenshot
  covers:
    - edge:navigation
    - edge:modal
