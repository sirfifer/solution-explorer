    - "Click the component node titled 'polyglot-api'"
  pass_when:
    - "exactly 1 edge renders at this drill level (the sampled http edge, polyglot-web to polyglot-api)"
    - "both sampled endpoints open their detail panels when clicked"
    - "no unexpected console or network errors during the flow"
