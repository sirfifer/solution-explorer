# GUI regression datasets (design authority: docs/testing/GUI-REGRESSION-STRATEGY.md).
#
# Each key maps a dataset name to the commands that materialize it and to the
# allowlist of KNOWN intentional console/network errors for runs against it.
# `scripts/gui-datasets.py generate <key>` runs the `generate` commands from the
# repo root with {staging} replaced by viewer/tests/gui/.datasets/<key>;
# `scripts/gui-datasets.py assemble <key>` overlays the staged payload onto a
# copy of the built viewer (viewer/dist) at viewer/tests/gui/.serve/<key>,
# removing the architecture data baked in from viewer/public first so the
# dataset fully controls what the app loads.
#
# Serve command (documented here as the single place runners read it from):
#   python3 -m http.server <port> --directory viewer/tests/gui/.serve/<key>
# The production build loads datasets correctly under this static server; this
# was verified against a live browser before this file was written.
#
# The allowlist is part of the reviewed plan: anything NOT listed here that
# appears in the console or as a failed network request FAILS the case. The two
# seeded probes are made by the app by design on every boot: the
# live-config.json fetch (404s in static mode, always) and the
# architecture/manifest.json probe (404s on monolith-layout datasets, where the
# split tree does not exist). Console "Failed to load resource" errors whose
# source URL matches an allowlisted path are covered by the same entry.
#
# The probe inventory below is the mechanized source of those allowlists
# (adjustment from the first Phase 2 run, which was failed by an undeclared
# search-index probe). Every fetch call site in viewer/src must have exactly
# one entry here, matched by the literal text of its first argument, and
# every entry whose can_404_on names a layout must be allowlisted by every
# dataset of that layout. scripts/gui-plan-check.py enforces both directions,
# so a new fetch path cannot land undeclared and an allowlist cannot silently
# drift from the code.

probe_inventory:
  - match: '"./live-config.json"'
    source: hooks/useLiveMonitor.ts
    fires: every boot
    allow_path: "/live-config.json"
    can_404_on: [monolith, split]
  - match: 'dataUrl("manifest.json")'
    source: App.tsx
    fires: every boot (split probe, monolith falls through)
    allow_path: "/architecture/manifest.json"
    can_404_on: [monolith]
  - match: 'dataUrl("publication.json")'
    source: App.tsx
    fires: every boot (optional publication-metadata sidecar probe, resolved
      through the same data base as the architecture fetch)
    allow_path: "/architecture/publication.json"
    # Optional sidecar: present only on the `publication` dataset, so it 404s on
    # every other monolith AND split dataset by design.
    can_404_on: [monolith, split]
  - match: 'dataUrl(path)'
    source: App.tsx
    fn: optionalJson
    fires: >
      split-mode boot, once per Overview sidecar, after manifest.json resolves
      (orientation.json, support.json, security.json all load through this one
      helper, so the call site has a single literal argument)
    # Three paths, one call site. The sidecars are additive: every dataset key
    # here predates them, so all three 404 by design on monolith and on split
    # alike until a dataset is regenerated with them.
    allow_path:
      - "/architecture/orientation.json"
      - "/architecture/support.json"
      - "/architecture/security.json"
    can_404_on: [monolith, split]
  - match: '"./architecture.json"'
    source: App.tsx
    fires: boot fallback on monolith datasets; present there by construction
    can_404_on: []
  - match: 'dataUrl(`data/detail-${safeId}.json`)'
    source: store.ts
    fn: loadComponentDetail
    fires: component selection on split datasets only (inline detail on monolith)
    can_404_on: []
  - match: 'dataUrl("coverage.json")'
    source: store.ts
    fn: loadCoverageRows
    fires: coverage expand on split datasets only (rows ride inline on monolith)
    can_404_on: []
  - match: 'dataUrl("activity.json")'
    source: store.ts
    fn: loadActivityData
    fires: Activity lens on split datasets only (data rides inline on monolith)
    can_404_on: []
  - match: '`${baseUrl}/manifest.json`'
    source: utils/search.ts
    fn: loadSearchShards
    fires: first search open, split datasets only (gated on component_detail_index)
    can_404_on: []
  - match: '`${baseUrl}/${name}`'
    source: utils/search.ts
    fn: loadSearchShards
    fires: after the search manifest loads, split datasets only
    can_404_on: []
  - match: '`${config.data_url}/version.json`'
    source: hooks/useLiveMonitor.ts
    fires: live monitoring only (requires a live-config.json)
    can_404_on: []
  - match: '`${config.data_url}/manifest.json`'
    source: hooks/useLiveMonitor.ts
    fires: live monitoring only
    can_404_on: []
  - match: '`${config.data_url}/status-overlay.json`'
    source: hooks/useLiveMonitor.ts
    fires: live monitoring only
    can_404_on: []
  - match: 'url'
    source: hooks/useAdminData.ts
    fires: admin dashboard only (Phase 4 surface)
    can_404_on: []

datasets:
  dogfood:
    description: >
      The repo's own projection, AI-enriched the same way the deploy pipeline
      does it: fresh v2 analysis merged with the committed AI-enhancement
      baseline (repo-root architecture.json) under --strict preservation.
    layout: monolith
    generate:
      - "python3 analyze.py . -o {staging}/architecture.json"
      - "python3 scripts/merge-ai-enhancements.py --baseline architecture.json --target {staging}/architecture.json --strict"
    allow_errors:
      - path: "/live-config.json"
        reason: "Live-monitoring probe; 404s by design when served statically."
      - path: "/architecture/manifest.json"
        reason: "Split-mode probe; 404s by design on a monolith-layout dataset."
      - path: "/architecture/publication.json"
        reason: "Optional publication-metadata sidecar probe; 404s by design when absent."
      - path: "/architecture/orientation.json"
        reason: "Optional Overview orientation sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/support.json"
        reason: "Optional Overview support sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/security.json"
        reason: "Optional Overview security sidecar; 404s by design on a dataset generated before the sidecars existed."

  split-mode:
    description: >
      The same repo analyzed in split mode: manifest.json plus per-component
      detail shards under data/, exercising lazy loading. Not AI-enriched (the
      enrichment merge tool targets monolith files); the split path is about
      the loading mechanics, not enrichment.
    layout: split
    generate:
      - "python3 analyze.py . --split -o {staging}/architecture"
    allow_errors:
      - path: "/live-config.json"
        reason: "Live-monitoring probe; 404s by design when served statically."
      - path: "/architecture/publication.json"
        reason: "Optional publication-metadata sidecar probe; 404s by design (this split dataset carries no sidecar)."
      - path: "/architecture/orientation.json"
        reason: "Optional Overview orientation sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/support.json"
        reason: "Optional Overview support sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/security.json"
        reason: "Optional Overview security sidecar; 404s by design on a dataset generated before the sidecars existed."

  unenriched:
    description: >
      Degradation variant: the dogfood projection with every ai_enhance key
      stripped (architecture, component, and relationship level), so
      AI-dependent surfaces must be absent, not broken.
    layout: monolith
    generate:
      - "python3 analyze.py . -o {staging}/architecture.json"
      - "python3 scripts/merge-ai-enhancements.py --baseline architecture.json --target {staging}/architecture.json --strict"
      - "python3 scripts/gui-datasets.py strip-ai {staging}/architecture.json"
    allow_errors:
      - path: "/live-config.json"
        reason: "Live-monitoring probe; 404s by design when served statically."
      - path: "/architecture/manifest.json"
        reason: "Split-mode probe; 404s by design on a monolith-layout dataset."
      - path: "/architecture/publication.json"
        reason: "Optional publication-metadata sidecar probe; 404s by design when absent."
      - path: "/architecture/orientation.json"
        reason: "Optional Overview orientation sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/support.json"
        reason: "Optional Overview support sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/security.json"
        reason: "Optional Overview security sidecar; 404s by design on a dataset generated before the sidecars existed."

  gaps:
    description: >
      Degradation variant: the enriched dogfood projection carrying an honest
      producer-gap record (R1's `gaps` key). The entries are injected by a
      documented transform and say so in their reason text; a real analyzer
      failure is not reproducible deterministically, the shape is.
    layout: monolith
    generate:
      - "python3 analyze.py . -o {staging}/architecture.json"
      - "python3 scripts/merge-ai-enhancements.py --baseline architecture.json --target {staging}/architecture.json --strict"
      - "python3 scripts/gui-datasets.py inject-gaps {staging}/architecture.json"
    allow_errors:
      - path: "/live-config.json"
        reason: "Live-monitoring probe; 404s by design when served statically."
      - path: "/architecture/manifest.json"
        reason: "Split-mode probe; 404s by design on a monolith-layout dataset."
      - path: "/architecture/publication.json"
        reason: "Optional publication-metadata sidecar probe; 404s by design when absent."
      - path: "/architecture/orientation.json"
        reason: "Optional Overview orientation sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/support.json"
        reason: "Optional Overview support sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/security.json"
        reason: "Optional Overview security sidecar; 404s by design on a dataset generated before the sidecars existed."

  malformed:
    description: >
      Resilience fixture (V12): a deterministic syntactically-invalid
      architecture.json. The viewer must degrade to a legible error message
      (never a blank page). Both boot probes fail by design.
    layout: monolith
    # The app never reaches the graph on this dataset (error screen), so the
    # welcome dialog never appears; the shard-convention lint reads this.
    first_load_shows_welcome: false
    generate:
      - "python3 scripts/gui-datasets.py write-malformed {staging}/architecture.json"
    allow_errors:
      - path: "/live-config.json"
        reason: "Live-monitoring probe; 404s by design when served statically."
      - path: "/architecture/manifest.json"
        reason: "Split-mode probe; 404s by design on a monolith-layout dataset."
      - path: "/architecture/publication.json"
        reason: "Optional publication-metadata sidecar probe; 404s by design when absent."
      - path: "/architecture/orientation.json"
        reason: "Optional Overview orientation sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/support.json"
        reason: "Optional Overview support sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/security.json"
        reason: "Optional Overview security sidecar; 404s by design on a dataset generated before the sidecars existed."

  old-format:
    description: >
      Frozen pre-gap projection (analyzer 1.0.0, generated 2026-07-07), checked
      in under fixtures/ and never regenerated. Locks the additive-projection
      promise at the UI level: today's viewer must render yesterday's data.
    layout: monolith
    generate:
      - "cp viewer/tests/gui/fixtures/old-format/architecture.json {staging}/architecture.json"
    allow_errors:
      - path: "/live-config.json"
        reason: "Live-monitoring probe; 404s by design when served statically."
      - path: "/architecture/manifest.json"
        reason: "Split-mode probe; 404s by design on a monolith-layout dataset."
      - path: "/architecture/publication.json"
        reason: "Optional publication-metadata sidecar probe; 404s by design when absent."
      - path: "/architecture/orientation.json"
        reason: "Optional Overview orientation sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/support.json"
        reason: "Optional Overview support sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/security.json"
        reason: "Optional Overview security sidecar; 404s by design on a dataset generated before the sidecars existed."

  publication:
    description: >
      Publication-sidecar variant: the enriched dogfood projection plus a valid
      publication.json written under architecture/ (so the viewer's
      dataUrl("publication.json") resolves to it). The header must show
      publication.subject.name ("Demo Publication Subject") instead of the
      folder-derived architecture.name, and the header banner and footer
      attribution must render with {{path}} substitution applied. Design
      authority: docs/publication/PUBLICATION-METADATA.md.
    layout: monolith
    generate:
      - "python3 analyze.py . -o {staging}/architecture.json"
      - "python3 scripts/merge-ai-enhancements.py --baseline architecture.json --target {staging}/architecture.json --strict"
      - "python3 scripts/gui-datasets.py write-publication {staging}/architecture/publication.json"
    allow_errors:
      - path: "/live-config.json"
        reason: "Live-monitoring probe; 404s by design when served statically."
      - path: "/architecture/manifest.json"
        reason: "Split-mode probe; 404s by design on a monolith-layout dataset."
      - path: "/architecture/publication.json"
        reason: "Publication-metadata sidecar; present on this dataset (200), allowlisted for parity with the monolith/split datasets where it 404s."
      - path: "/architecture/orientation.json"
        reason: "Optional Overview orientation sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/support.json"
        reason: "Optional Overview support sidecar; 404s by design on a dataset generated before the sidecars existed."
      - path: "/architecture/security.json"
        reason: "Optional Overview security sidecar; 404s by design on a dataset generated before the sidecars existed."
