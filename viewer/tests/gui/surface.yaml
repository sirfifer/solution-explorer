  # The two surfaces below are real surfaces the design doc inventories, but
  # no Phase 1 dataset can exercise them (StatusDashboard needs
  # architecture.live_status from a live fixture; SolutionIndex needs a
  # composed multi-repo solution dataset). They are listed HERE, not in the
  # ignore list, so the deferral is a waiver in plan/waivers.yaml, printed on
  # every check run, per the design's visible-decision rule.
  - component: StatusDashboard
    file: StatusDashboard.tsx
  - component: SolutionIndex
    file: SolutionIndex.tsx
  # The Overview interface and the two human-view lens panels that landed with
  # it. They are interactive surfaces, so they belong here rather than in the
  # ignore list, but the AI plan has no Overview vector yet: the deterministic
  # crawl is what walks them today. Each therefore carries a waiver in
  # plan/waivers.yaml naming that crawl coverage, which keeps the missing AI
  # cases a decision printed on every run instead of an omission.
  - component: SystemOverview
    file: SystemOverview.tsx
  - component: ExperienceSwitcher
    file: ExperienceSwitcher.tsx
  - component: ViewerPreferences
    file: ViewerPreferences.tsx
  - component: ThemeSwitcher
    file: ThemeSwitcher.tsx
  - component: IdentityCard
    file: IdentityCard.tsx
  - component: InterfacePreview
    file: InterfacePreview.tsx
  - component: TrustLedger
    file: TrustLedger.tsx
  - component: WorkbenchTrustStrip
    file: WorkbenchTrustStrip.tsx
  - component: SupportPanel
    file: SupportPanel.tsx
  - component: SecurityPanel
    file: SecurityPanel.tsx

ignore:
  - file: __tests__/helpSystem.test.tsx
    reason: >
      Component unit test; executable coverage rather than a production UI
      surface. The HelpSystem and HeaderHelpButton surfaces are inventoried
      separately above.
  - file: __tests__/orientationWalk.test.tsx
    reason: >
      Component unit test; executable coverage rather than a production UI
      surface. The OrientationInvite and OrientationWalk surfaces are
      inventoried separately above.
  - file: MarkdownRenderer.tsx
    reason: >
      Presentational renderer; exercised implicitly wherever docs, help, and AI
      content render (V3, V10). No standalone user flow.
  - file: Tooltip.tsx
    reason: >
      Presentational wrapper; exercised implicitly by every labeled control the
      plan touches. No standalone user flow.
  - file: VirtualList.tsx
    reason: >
      Virtualization primitive; exercised implicitly by the long symbol and
      entry lists the plan scrolls (V2, V11). No standalone user flow.
  - file: RationaleStrip.tsx
    reason: >
      Passive context strip inside DetailPanel's overview; renders nothing
      without rationale data. Exercised implicitly by V3 overview cases.
  - file: AdminDashboard.tsx
    reason: >
      Live/admin surface requiring live-config.json; Phase 4 scope by
      design-doc decision. Recorded deferral.
  - file: admin/ActivityTab.tsx
    reason: "Part of AdminDashboard; same Phase 4 deferral."
  - file: admin/HealthTab.tsx
    reason: "Part of AdminDashboard; same Phase 4 deferral."
  - file: admin/HistoryTab.tsx
    reason: "Part of AdminDashboard; same Phase 4 deferral."
  - file: admin/ResourcesTab.tsx
    reason: "Part of AdminDashboard; same Phase 4 deferral."
  - file: admin/SettingsTab.tsx
    reason: "Part of AdminDashboard; same Phase 4 deferral."
  - file: ElkRoutedEdge.tsx
    reason: >
      React Flow edge renderer; it draws the route ELK solved and reveals the
      label above a zoom threshold. Nothing to click. Exercised implicitly by
      every graph case (V1, V2). No standalone user flow.
