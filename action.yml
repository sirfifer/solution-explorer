name: 'SysCorpus'
description: 'Generate interactive architecture diagrams from any codebase. Supports multi-repo solutions.'
branding:
  icon: 'git-branch'
  color: 'blue'

inputs:
  config:
    description: 'Path to solution-explorer.json for multi-repo analysis'
    required: false
    default: ''
  path:
    description: 'Path to the repository root to analyze (single-repo mode)'
    required: false
    default: '.'
  deploy-to:
    description: 'Deployment target: cloudflare, github-pages, or artifact-only'
    required: false
    default: 'artifact-only'
  cloudflare-api-token:
    description: 'Cloudflare API token (required when deploy-to is cloudflare)'
    required: false
    default: ''
  cloudflare-account-id:
    description: 'Cloudflare account ID (required when deploy-to is cloudflare)'
    required: false
    default: ''
  cloudflare-project-name:
    description: 'Cloudflare Pages project name'
    required: false
    default: 'solution-explorer'
  github-token:
    description: 'GitHub token for cloning private repos in multi-repo mode'
    required: false
    default: ''
  live-monitor:
    description: 'Enable live monitoring data generation alongside viewer build'
    required: false
    default: 'false'
  version:
    description: 'SysCorpus version override (e.g., v0.3.0, beta). Defaults to the action ref tag.'
    required: false
    default: ''
  artifact-name:
    description: 'Name for the uploaded build artifact. Override when a caller repo also runs the reference workflow to avoid a collision.'
    required: false
    default: 'architecture-viz'
  require-publication:
    description: 'Fail the build when publication.json is missing or invalid. A deployed viewer is a publication, and for a codebase you do not own that sidecar carries the unofficial framing, the upstream license and the exact commit. Default false warns loudly instead of failing, so existing installs keep deploying; set true for any public demo of a codebase you do not own. An INVALID publication.json always fails, either way.'
    required: false
    default: 'false'
  diff-against-url:
    description: 'Opt-in two-slot health check (card G3). When set to the URL of your currently-live (blue) projection JSON (for example https://<cf-project>.pages.dev/architecture.json, or the split manifest.json), the just-built (green) projection is diffed against it and the report is written to the job step summary plus a projection-diff.json artifact. Non-blocking: a fetch or diff failure never fails the deploy. Default empty = skipped, zero behavior change.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Resolve version
      id: resolve
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        REF="${VERSION_INPUT:-$ACTION_REF}"
        echo "ref=$REF" >> "$GITHUB_OUTPUT"
        if [ "$ACTION_REF" = "main" ] || [ "$ACTION_REF" = "refs/heads/main" ]; then
          echo "::warning::Using sirfifer/solution-explorer@main tracks the latest commit. Pin to @latest for stability. See https://github.com/sirfifer/solution-explorer#versioning"
        fi

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Checkout SysCorpus
      uses: actions/checkout@v4
      with:
        repository: 'sirfifer/solution-explorer'
        ref: ${{ steps.resolve.outputs.ref }}
        path: '.solution-explorer'

    - name: Install SysCorpus
      shell: bash
      run: python3 -m pip install --quiet -e ".solution-explorer[all]"

    - name: Run Analyzer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CONFIG: ${{ inputs.config }}
        TARGET_PATH: ${{ inputs.path }}
      run: |
        OUTPUT_DIR=".solution-explorer/viewer/public/architecture"
        SINGLE_FILE=".solution-explorer/viewer/public/architecture.json"

        # Use pre-built architecture data only on push events (AI-enhanced flow).
        # On workflow_dispatch or pull_request, always run fresh analysis.
        if [ "${{ github.event_name }}" = "push" ] && [ -f "architecture/manifest.json" ]; then
          # Split-mode pre-built data (DPEA pipeline output)
          echo "Using pre-built architecture directory (AI-enhanced, split mode)"
          mkdir -p "$OUTPUT_DIR"
          cp -r architecture/* "$OUTPUT_DIR/"
        elif [ "${{ github.event_name }}" = "push" ] && [ -f "architecture.json" ]; then
          # Legacy single-file pre-built data
          echo "Using pre-built architecture JSON (AI-enhanced)"
          mkdir -p "$(dirname "$SINGLE_FILE")"
          cp architecture.json "$SINGLE_FILE"
        elif [ -n "$CONFIG" ]; then
          python3 .solution-explorer/analyze.py \
            --config "$CONFIG" \
            --split -o "$OUTPUT_DIR" --compact
        else
          python3 .solution-explorer/analyze.py \
            "$TARGET_PATH" \
            --split -o "$OUTPUT_DIR" --compact
        fi

    - name: Preserve AI Enhancements
      shell: bash
      run: |
        OUTPUT_DIR=".solution-explorer/viewer/public/architecture"
        BASELINE_DIR="architecture"
        BASELINE_FILE="architecture.json"

        # If we ran fresh analysis (not pre-built), merge AI enhancements from baseline.
        # The baseline is the previously committed architecture data in the target repo.
        if [ "${{ github.event_name }}" != "push" ] || { [ ! -f "$BASELINE_DIR/manifest.json" ] && [ ! -f "$BASELINE_FILE" ]; }; then
          # Determine which baseline format exists
          if [ -f "$BASELINE_DIR/manifest.json" ]; then
            echo "Merging AI enhancements from baseline (split mode)"
            python3 .solution-explorer/scripts/merge-ai-enhancements.py \
              --baseline "$BASELINE_DIR/manifest.json" \
              --target "$OUTPUT_DIR/manifest.json" \
              --strict
          elif [ -f "$BASELINE_FILE" ]; then
            echo "Merging AI enhancements from baseline (single file)"
            # For single-file baseline, merge into the split-mode manifest
            if [ -f "$OUTPUT_DIR/manifest.json" ]; then
              python3 .solution-explorer/scripts/merge-ai-enhancements.py \
                --baseline "$BASELINE_FILE" \
                --target "$OUTPUT_DIR/manifest.json" \
                --strict
            fi
          else
            echo "No baseline found, skipping AI enhancement merge"
          fi
        else
          echo "Using pre-built data, skipping merge"
        fi

    - name: Validate Publication Metadata
      shell: bash
      env:
        REQUIRE_PUBLICATION: ${{ inputs.require-publication }}
      run: |
        # A deployed viewer is a publication (docs/publication/PUBLICATION-METADATA.md).
        # The sidecar carries the publisher, the exact snapshot, the disclaimers
        # and, for a codebase we do not own, the unofficial-and-not-affiliated
        # framing plus the upstream license. Its absence is otherwise silent.
        PUBLIC_DIR=".solution-explorer/viewer/public"
        if [ -f "publication.json" ] && [ ! -f "$PUBLIC_DIR/publication.json" ]; then
          echo "Found publication.json in the repository root; copying it into the bundle."
          cp publication.json "$PUBLIC_DIR/publication.json"
        fi
        ARGS="$PUBLIC_DIR"
        if [ "$REQUIRE_PUBLICATION" = "true" ]; then
          ARGS="$ARGS --require"
        fi
        python3 .solution-explorer/scripts/validate-publication.py $ARGS

    - name: Build Viewer
      shell: bash
      working-directory: .solution-explorer/viewer
      run: |
        npm ci
        npm run build

    - name: Generate Live Data
      if: inputs.live-monitor == 'true'
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        mkdir -p .solution-explorer/viewer/dist/live
        python3 -c "
        import json, time, datetime, os
        sha = os.environ['GITHUB_SHA']
        repo = os.environ['GITHUB_REPOSITORY']
        owner, repo_name = repo.split('/')

        # version.json
        version = {
            'version': int(time.time()),
            'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'commit_sha': sha
        }
        with open('.solution-explorer/viewer/dist/live/version.json', 'w') as f:
            json.dump(version, f, indent=2)

        # live-config.json
        config = {
            'enabled': True,
            'data_url': f'https://{owner}.github.io/{repo_name}/live',
            'backend_mode': 'github',
            'polling': {
                'default_interval_seconds': 30,
                'min_interval_seconds': 15,
                'idle_interval_seconds': 120,
                'adaptive': True,
                'pause_when_hidden': True
            },
            'features': {
                'activity_log': True,
                'admin_dashboard': True,
                'version_history': True,
                'ci_status_overlay': True,
                'realtime_ci_webhooks': False,
                'realtime_push': False
            }
        }
        with open('.solution-explorer/viewer/dist/live/live-config.json', 'w') as f:
            json.dump(config, f, indent=2)
        "

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: .solution-explorer/viewer/dist
        retention-days: 30

    - name: Blue/green projection diff (demo)
      # Opt-in two-slot health check (card G3). When diff-against-url is set,
      # fetch the currently-live (blue) projection and diff the just-built (green)
      # one against it, surfacing the report in the step summary. Non-blocking:
      # blue-green-diff.py always exits 0, so a fetch or diff failure never breaks
      # the deploy. Default (empty) skips this step, so existing consumers see
      # zero behavior change.
      if: inputs.diff-against-url != ''
      shell: bash
      env:
        DIFF_AGAINST_URL: ${{ inputs.diff-against-url }}
      run: |
        DIST=".solution-explorer/viewer/dist"
        if [ -f "$DIST/architecture.json" ]; then
          GREEN="$DIST/architecture.json"
        elif [ -f "$DIST/architecture/manifest.json" ]; then
          GREEN="$DIST/architecture/manifest.json"
        else
          {
            echo "## Blue/green projection diff (demo)"
            echo ""
            echo "**BLUE/GREEN DIFF UNAVAILABLE:** no built projection found under $DIST; skipping (non-blocking)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python3 .solution-explorer/scripts/blue-green-diff.py \
          --blue "$DIFF_AGAINST_URL" \
          --new "$GREEN" \
          --label demo \
          --summary-out "$GITHUB_STEP_SUMMARY" \
          --json-out projection-diff.json

    - name: Upload Projection Diff (demo)
      if: inputs.diff-against-url != '' && hashFiles('projection-diff.json') != ''
      uses: actions/upload-artifact@v7
      with:
        name: projection-diff
        path: projection-diff.json
        retention-days: 30

    - name: Deploy to Cloudflare Pages
      if: inputs.deploy-to == 'cloudflare'
      uses: cloudflare/wrangler-action@v3
      # cloudflare-project-name is interpolated into wrangler-action's `command`,
      # which is not a `run:` shell block. wrangler-action runs the command via
      # @actions/exec (no shell), so `$VAR` indirection would be passed literally
      # and would not expand, and there is no shell-injection surface here.
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: pages deploy .solution-explorer/viewer/dist --project-name=${{ inputs.cloudflare-project-name }} --branch=main --commit-dirty=true

    - name: Upload GitHub Pages Artifact
      if: inputs.deploy-to == 'github-pages'
      uses: actions/upload-pages-artifact@v3
      with:
        path: .solution-explorer/viewer/dist
