[project]
name = "solution-explorer"
dynamic = ["version"]
description = "Architecture visualization tool for any codebase"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "sirfifer" },
]

[project.urls]
Homepage = "https://github.com/sirfifer/solution-explorer"
Repository = "https://github.com/sirfifer/solution-explorer"
Issues = "https://github.com/sirfifer/solution-explorer/issues"

[project.optional-dependencies]
models = [
    "pydantic>=2.5",
]
# The MCP server (analyzer.mcp) ships in this package and needs no third-party
# dependency: it speaks the MCP stdio JSON-RPC transport directly (invariant I7,
# local-first zero-dependency). This group reserves the official SDK as a
# documented upgrade path (see analyzer/mcp/server.py); installing it does not
# change the shipped server, which uses its own transport.
mcp = [
    "mcp>=1.0",
]
incremental = [
    "gitpython>=3.1",
]
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-swift>=0.0.1",
    "tree-sitter-rust>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-cpp>=0.23",
]
live = [
    "gitpython>=3.1",
    "httpx>=0.27",
    "pydantic>=2.5",
]
# The project knowledge layer (.solution-explorer/rules, P6-12) stores rules as
# YAML. The analyzer core stays zero-dependency (invariant I7): without PyYAML
# the rules loader warns loudly and skips project rules; with this extra the
# rules apply. Included in [all] and [dev] so the feature-complete install and
# both CI lanes exercise the real rules path.
rules = [
    "pyyaml>=6",
]
all = [
    "solution-explorer[live,treesitter,rules]",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyyaml>=6",
    # SARIF export test (tests/test_sarif.py) validates generated output
    # against the committed OASIS SARIF 2.1.0 JSON schema fixture.
    "jsonschema>=4",
]

[project.scripts]
solution-explorer = "analyzer.cli:main"
solution-explorer-mcp = "analyzer.mcp:main"

[tool.setuptools.dynamic]
version = {attr = "analyzer.__version__"}

[tool.setuptools.packages.find]
include = ["analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["analyzer"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
