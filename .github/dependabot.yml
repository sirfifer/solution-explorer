version: 2
updates:
  # Python core (pyproject.toml at repo root)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Viewer (React/TypeScript app)
  - package-ecosystem: "npm"
    directory: "/viewer"
    schedule:
      interval: "weekly"
    groups:
      viewer-dependencies:
        patterns:
          - "*"

  # npm CLI package
  - package-ecosystem: "npm"
    directory: "/packages/cli"
    schedule:
      interval: "weekly"
    groups:
      cli-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflows (keeps hash-pinned actions current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
