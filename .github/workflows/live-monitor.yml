name: Live Monitor

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Architecture Visualization"]
    types: [completed]
  workflow_dispatch:

# Serialize all runs targeting the same ref to prevent concurrent deploys
concurrency:
  group: live-monitor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  update-and-deploy:
    name: Update Architecture & Deploy Live Data
    # Opt-in: runs only when a downstream installation enables live monitoring
    # via the LIVE_MONITOR_ENABLED repo variable, or when manually dispatched
    # (including via deploy-downstream). Without this guard, upstream pushes
    # to sirfifer/solution-explorer trigger this workflow against a repo that
    # has no GitHub Pages configured, and it fails every push to main.
    if: vars.LIVE_MONITOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          if [ -f "pyproject.toml" ]; then
            # Live projection generation must use the same shipping parser tier
            # as CI; silently falling back can publish plausible but incomplete
            # architecture data.
            pip install -e ".[all]"
          fi

      - name: Determine Commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Architecture Baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .arch-baseline
          key: arch-baseline-${{ github.ref }}
          # The save key appends the commit sha, so an exact-key restore can
          # never hit. Prefix-match to restore the most recent baseline.
          restore-keys: |
            arch-baseline-${{ github.ref }}-

      - name: Run Architecture Analyzer
        run: |
          mkdir -p .arch-output/live

          if [ -f "solution-explorer.json" ]; then
            # Multi-repo mode: full scan (incremental not yet supported)
            python3 analyze.py --config solution-explorer.json \
              -o .arch-output/architecture.json --compact
          elif [ -f ".arch-baseline/architecture.json" ]; then
            # Incremental mode: surgical update of changed components only
            BASE_SHA=""
            if [ -f ".arch-baseline/sha" ]; then
              BASE_SHA="$(cat .arch-baseline/sha)"
            fi
            python3 analyze.py . --incremental \
              --baseline .arch-baseline/architecture.json \
              --base-sha "${BASE_SHA}" \
              --head-sha "${{ steps.sha.outputs.sha }}" \
              -o .arch-output/architecture.json --compact
          else
            # First run: full scan to establish baseline
            python3 analyze.py . \
              -o .arch-output/architecture.json --compact
          fi

      - name: Preserve AI Enhancements
        run: |
          if [ -f ".arch-baseline/architecture.json" ]; then
            python3 scripts/merge-ai-enhancements.py \
              --baseline .arch-baseline/architecture.json \
              --target .arch-output/architecture.json \
              --strict
          else
            echo "No baseline found, skipping AI enhancement merge"
          fi

      - name: Collect CI Status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/collect-ci-status.py \
            --repo "${{ github.repository }}" \
            --sha "${{ steps.sha.outputs.sha }}" \
            -o .arch-output/live/status-overlay.json

      - name: Generate version.json
        run: |
          python3 -c "
          import json, time, datetime
          data = {
              'version': int(time.time()),
              'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'commit_sha': '${{ steps.sha.outputs.sha }}'
          }
          with open('.arch-output/live/version.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Generate live-config.json
        run: |
          python3 -c "
          import json, os
          repo = '${{ github.repository }}'
          owner, repo_name = repo.split('/')
          worker_url = os.environ.get('CF_WORKER_URL', '')

          mode = 'cloudflare' if worker_url else 'github'
          data_url = f'https://{owner}.github.io/{repo_name}/live'

          config = {
              'enabled': True,
              'data_url': data_url,
              'backend_mode': mode,
              'polling': {
                  'default_interval_seconds': 15 if mode == 'cloudflare' else 30,
                  'min_interval_seconds': 10 if mode == 'cloudflare' else 15,
                  'idle_interval_seconds': 60 if mode == 'cloudflare' else 120,
                  'adaptive': True,
                  'pause_when_hidden': True
              },
              'features': {
                  'activity_log': True,
                  'admin_dashboard': True,
                  'version_history': True,
                  'ci_status_overlay': True,
                  'realtime_ci_webhooks': mode == 'cloudflare',
                  'realtime_push': False
              }
          }
          if worker_url:
              config['worker_url'] = worker_url
              config['project_id'] = repo_name
          with open('.arch-output/live/live-config.json', 'w') as f:
              json.dump(config, f, indent=2)
          "
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}

      - name: Generate Admin Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate-admin-summary.py \
            --arch .arch-output/architecture.json \
            --version .arch-output/live/version.json \
            --repo "${{ github.repository }}" \
            --sha "${{ steps.sha.outputs.sha }}" \
            -o .arch-output/live/admin-summary.json

      - name: Copy Architecture to Live Directory
        run: cp .arch-output/architecture.json .arch-output/live/architecture.json

      - name: Prepare Baseline for Caching
        run: |
          mkdir -p .arch-baseline
          cp .arch-output/architecture.json .arch-baseline/architecture.json
          echo "${{ steps.sha.outputs.sha }}" > .arch-baseline/sha

      - name: Save Architecture Baseline
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .arch-baseline
          key: arch-baseline-${{ github.ref }}-${{ steps.sha.outputs.sha }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .arch-output/live

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # --- Cloudflare R2 Upload (only when CF_WORKER_URL is configured) ---

      - name: Upload to Cloudflare R2
        # The secrets context is not available in step-level if: expressions, so
        # this gate runs in shell against an env var instead (F-CRIT-2).
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$CF_WORKER_URL" ]; then
            echo "CF_WORKER_URL not configured, skipping Cloudflare R2 upload"
            exit 0
          fi

          PROJECT_ID="$REPO_NAME"
          ENDPOINT="$CF_R2_ENDPOINT"
          BUCKET="solution-explorer-data"

          # Upload all live data files to R2
          for file in .arch-output/live/*.json; do
            filename=$(basename "$file")
            aws s3 cp "$file" "s3://${BUCKET}/${PROJECT_ID}/${filename}" \
              --endpoint-url "$ENDPOINT" \
              --content-type "application/json"
          done

          # Upload architecture.json (also called manifest.json by viewer)
          aws s3 cp .arch-output/architecture.json \
            "s3://${BUCKET}/${PROJECT_ID}/manifest.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json"

          # NOTE: The analyzer step above runs single-file --compact mode, so it
          # never writes .arch-output/data/detail-*.json. The former detail-file
          # upload block here was dead code and was removed (F-CRIT-2). If this
          # workflow ever switches to --split, restore a detail upload that also
          # keeps the worker's cleanupOrphanedDetails escape scheme in sync.

          echo "Uploaded to R2: ${BUCKET}/${PROJECT_ID}/"

      - name: Notify Cloudflare Worker
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_INGEST_TOKEN: ${{ secrets.CF_INGEST_TOKEN }}
          # Pass the commit message through the environment, never interpolate it
          # into the script body, to avoid command injection (F-CRIT-2).
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ -z "$CF_WORKER_URL" ]; then
            echo "CF_WORKER_URL not configured, skipping worker notification"
            exit 0
          fi

          PROJECT_ID="$REPO_NAME"

          # Extract counts and component IDs from architecture.json
          COMPONENT_COUNT=$(python3 -c "
          import json
          with open('.arch-output/architecture.json') as f:
              arch = json.load(f)
          def count(comps):
              return sum(1 + count(c.get('children', [])) for c in comps)
          print(count(arch.get('components', [])))
          ")

          RELATIONSHIP_COUNT=$(python3 -c "
          import json
          with open('.arch-output/architecture.json') as f:
              arch = json.load(f)
          print(len(arch.get('relationships', [])))
          ")

          COMPONENT_IDS=$(python3 -c "
          import json
          with open('.arch-output/architecture.json') as f:
              arch = json.load(f)
          def collect_ids(comps):
              ids = []
              for c in comps:
                  ids.append(c['id'])
                  ids.extend(collect_ids(c.get('children', [])))
              return ids
          print(json.dumps(collect_ids(arch.get('components', []))))
          ")

          VERSION=$(python3 -c "
          import json
          with open('.arch-output/live/version.json') as f:
              print(json.load(f)['version'])
          ")

          COMMIT_MSG=$(python3 -c "
          import json, os
          msg = os.environ.get('COMMIT_MESSAGE') or 'workflow dispatch'
          print(json.dumps(msg[:200]))
          ")

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${CF_WORKER_URL}/ingest" \
            -H "Authorization: Bearer ${CF_INGEST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"project_id\": \"${PROJECT_ID}\",
              \"version\": ${VERSION},
              \"commit_sha\": \"${COMMIT_SHA}\",
              \"commit_message\": ${COMMIT_MSG},
              \"component_count\": ${COMPONENT_COUNT},
              \"relationship_count\": ${RELATIONSHIP_COUNT},
              \"component_ids\": ${COMPONENT_IDS}
            }")

          if [ "$HTTP_CODE" -eq 204 ]; then
            echo "Worker notified successfully"
          else
            echo "::warning::Worker returned HTTP ${HTTP_CODE}"
          fi
