name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Extract and validate version
        id: meta
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(python3 -c "from analyzer import __version__; print(__version__)")

          echo "Tag version:  $TAG_VERSION"
          echo "Code version: $CODE_VERSION"

          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match analyzer/__init__.py ($CODE_VERSION)"
            exit 1
          fi

          # Detect prerelease (contains alpha, beta, or rc)
          if echo "$TAG_VERSION" | grep -qE '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: CI Suite
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Generate SLSA build provenance
        # PyPI does not have an equivalent of npm's built-in
        # `npm publish --provenance` (used below), so this repo attests the
        # built distributions itself. The attestation is queryable via
        # `gh attestation verify` and shows up on the release's Attestations
        # tab.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1 (v1.14.1)

  publish-npm:
    name: Publish to npm
    needs: [validate, test]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build CLI bundle
        working-directory: packages/cli
        run: bash scripts/prepare-bundle.sh && npm run build

      - name: Publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ needs.validate.outputs.prerelease }}" = "true" ]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

  github-release:
    name: GitHub Release
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Try to extract the section for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## .*${VERSION//./\\.}/ {found=1; next} /^## / {if(found) exit} found {print}" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi
          # Write to file to preserve newlines
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [ "${{ needs.validate.outputs.prerelease }}" = "true" ]; then
            FLAGS="--prerelease"
          else
            FLAGS="--latest"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "v${{ needs.validate.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            $FLAGS

  supply-chain:
    name: SBOM and Provenance
    needs: [validate, test, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: 'stable'

      - name: Install project and SBOM tools
        run: |
          pip install -e ".[all,dev]"
          pip install cyclonedx-py==7.3.0
          go install github.com/interlynk-io/sbomqs/v2@v2.0.11

      - name: Generate Python SBOM
        run: |
          mkdir -p sbom
          cyclonedx-py environment --pyproject pyproject.toml --sv 1.6 \
            -o sbom/solution-explorer-${{ needs.validate.outputs.version }}-python-sbom.json

      - name: Generate npm SBOM (viewer)
        working-directory: viewer
        run: |
          npm ci
          # See sbom.yml for why --ignore-npm-errors is needed: it works
          # around a known `npm ls` false positive on packages that bundle
          # their own optional sub-dependencies (bundleDependencies).
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --ignore-npm-errors \
            --output-format JSON --spec-version 1.6 \
            --output-file "$GITHUB_WORKSPACE/sbom/solution-explorer-${{ needs.validate.outputs.version }}-viewer-sbom.json"

      - name: Score SBOM quality
        run: |
          SBOMQS="$(go env GOPATH)/bin/sbomqs"
          {
            echo "## Release SBOM Quality (sbomqs, v${{ needs.validate.outputs.version }})"
            for f in sbom/*.json; do
              echo "### $f"
              echo '```'
              "$SBOMQS" score --profile ntia,interlynk --detailed "$f"
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate SLSA build provenance for the SBOMs
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'sbom/*.json'

      - name: Attach SBOMs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" sbom/*.json --clobber

  update-tags:
    name: Update Channel Tags
    needs: [validate, publish-pypi, publish-npm, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Update moving tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(git rev-parse HEAD)

          if [ "${{ needs.validate.outputs.prerelease }}" = "true" ]; then
            echo "Updating 'beta' tag to point to $COMMIT"
            git tag -f beta "$COMMIT"
            git push origin beta --force
          else
            echo "Updating 'latest' tag to point to $COMMIT"
            git tag -f latest "$COMMIT"
            git push origin latest --force

            # Also update beta to latest stable (so beta is never behind stable)
            echo "Updating 'beta' tag to point to $COMMIT"
            git tag -f beta "$COMMIT"
            git push origin beta --force
          fi
