name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      - name: Ruff check
        run: ruff check analyze.py analyzer/ scripts/ tests/

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[all,dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=analyzer \
            --cov-report=term-missing \
            --cov-report=html:coverage-py

      - name: Coverage summary
        if: always()
        run: |
          echo "## Python Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report --format=text 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage-py/
          retention-days: 14

  viewer-lint:
    name: Viewer Lint & Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('viewer/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm ci

      - name: ESLint
        run: npx eslint src/

      - name: TypeScript check
        run: npx tsc -b

  viewer-test:
    name: Viewer Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('viewer/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Coverage summary
        if: always()
        run: |
          echo "## Viewer Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage/text-summary.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No coverage summary available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-coverage
          path: viewer/coverage/
          retention-days: 14

  build:
    name: Build Viewer
    needs: [viewer-lint, viewer-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('viewer/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Generate architecture data
        run: python3 analyze.py . -o viewer/public/architecture.json --compact

      - name: Build viewer
        working-directory: viewer
        run: npm ci && npm run build

      - name: Verify build output
        run: test -f viewer/dist/index.html

  gate:
    name: CI Gate
    if: always()
    needs: [python-lint, python-test, viewer-lint, viewer-test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.python-lint.result }}" != "success" ]] ||
             [[ "${{ needs.python-test.result }}" != "success" ]] ||
             [[ "${{ needs.viewer-lint.result }}" != "success" ]] ||
             [[ "${{ needs.viewer-test.result }}" != "success" ]] ||
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed"
