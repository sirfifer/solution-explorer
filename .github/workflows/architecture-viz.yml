name: Architecture Visualization

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only run one at a time per branch
concurrency:
  group: arch-viz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Python tools
        # Install the tree-sitter tier (and dev tools) so this lane exercises the
        # SHIPPING parser tier, matching ci.yml's python-test lane. Regex-fallback
        # only ran here before, which diverged the two lanes' parser output and
        # skipped the parity tests (P4-1 CI Discovered 2026-07-13). The parity
        # tier-skip stays in place as defense in depth.
        run: pip install -e ".[all,dev]"

      - name: Lint Python
        run: ruff check analyze.py analyzer/ scripts/ tests/

      - name: Test Python
        run: pytest tests/ -v

      - name: Install Viewer Dependencies
        working-directory: viewer
        run: npm ci

      - name: Lint TypeScript
        working-directory: viewer
        run: npx eslint src/

      - name: Test Viewer
        working-directory: viewer
        run: npm test

      - name: TypeScript Check
        working-directory: viewer
        run: npx tsc -b

  generate:
    name: Generate Architecture Viz
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run Architecture Analyzer
        run: |
          if [ -f "solution-explorer.json" ]; then
            python3 analyze.py --config solution-explorer.json \
              -o viewer/public/architecture.json --compact
          else
            python3 analyze.py . \
              -o viewer/public/architecture.json --compact
          fi

      - name: Preserve AI Enhancements
        run: |
          # If a committed architecture.json exists with AI enhancements,
          # merge them into the freshly analyzed output. --strict fails the
          # build (leaving the output untouched) if the preservation ratio
          # drops below threshold, so silent AI data loss cannot ship. The
          # merge tolerates ID drift (repo-prefix add/remove, path-preserving
          # renames) via fallback matching; genuine removals do not fail it.
          if [ -f "architecture.json" ]; then
            python3 scripts/merge-ai-enhancements.py \
              --baseline architecture.json \
              --target viewer/public/architecture.json \
              --strict
          fi

      - name: Blue/green projection diff (dogfood)
        # Two-slot health check (card G3, REGRESSION-STRATEGY.md). VISION.md keeps
        # the self-repo dogfood site LOCAL (no public deploy), so there is no live
        # URL to fetch: git is the native retention slot. The committed
        # architecture.json is the prior (blue) projection and the freshly
        # generated viewer/public/architecture.json (post AI-enhancement merge) is
        # the new (green) one. It is a HEALTH CHECK, not a gate (the analyzed repo
        # moves on its own), so blue-green-diff.py ALWAYS exits 0: a missing or
        # unreadable blue degrades loudly in the step summary and never fails CI.
        run: |
          python3 scripts/blue-green-diff.py \
            --blue architecture.json \
            --new viewer/public/architecture.json \
            --label dogfood \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --json-out projection-diff.json

      - name: Upload Projection Diff
        # Only present when the diff succeeded (blue and green both loaded); on a
        # loud degrade no JSON is written and this step is skipped.
        if: hashFiles('projection-diff.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: projection-diff
          path: projection-diff.json
          retention-days: 30

      - name: Install Viewer Dependencies
        working-directory: viewer
        run: npm ci

      - name: Build Viewer
        working-directory: viewer
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-viz
          path: viewer/dist
          retention-days: 30

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT_NAME != ''
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: architecture-viz
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main --commit-dirty=true
