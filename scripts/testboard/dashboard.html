        "and the tick marks where the mean falls.";
    h.push('<span' + tipAttr(ratioTip) + ">");
    h.push('<span class="dbar' + band + '"><i style="width:' + width + '%"></i></span>');
    if (s.mean && s.max) {
      h.push('<span class="dmark" style="left:' +
        Math.max(0, Math.min(100, Math.round(100 * s.mean / s.max))) + '%"></span>');
    }
    if (ratio !== null) {
      h.push('<span class="ratio' + band + '">x' +
        (ratio < 10 ? ratio.toFixed(1) : Math.round(ratio)) + " mean</span>");
    }
    h.push("</span>");
  }
  h.push("</div>");

  h.push("</div>");
  return h.join("");
}

/* The coverage panel is what the suite claims it actually reached. It is the
   substance behind a green tick, so it gets a panel rather than a footnote. */
function coveragePanel(run, id) {
  var coverage = run.coverage || [];
  var h = [];
  h.push('<div class="panel"><div class="ph"' + defAttr("field", "coverage") + ">coverage reported" +
    '<span class="n">' + num(coverage.length) +
    (coverage.length === 1 ? " line" : " lines") + "</span></div>");
  h.push('<div class="pb covlist scrollbox" data-keep="' + esc(id) + '|cov" data-pin="bottom">');
  if (!coverage.length) {
    h.push('<div class="none">No coverage annotation yet. The suite attaches these to its cases as ' +
      "they finish, so lines appear here while the run works.</div>");
  } else {
    h.push(coverage.map(coverageLine).join(""));
  }
  h.push("</div></div>");
  return h.join("");
}

function eventPanel(run, id) {
  var startTs = parseTs(run.started_at);
  var events = (run.events || []).slice(-14);
  var h = [];
  h.push('<div class="panel" style="margin-top:10px"><div class="ph"' + tipAttr(TIP.events) +
    ">event tail" + '<span class="n">offsets from the start of the run</span></div>');
  h.push('<div class="events scrollbox" data-keep="' + esc(id) + '|events" data-pin="bottom">');
  if (!events.length) {
    h.push('<div class="none">No events have been written for this run yet.</div>');
  } else {
    h.push(events.map(function (ev) { return eventLine(ev, startTs); }).join(""));
  }
  h.push("</div></div>");
  return h.join("");
}

function eventLine(ev, startTs) {
  var type = String(ev.type || "event");
  var cls = "ev e-" + type.replace(/[^a-z_]/gi, "");
  if (type === "case_end") cls = "ev e-" + (ev.status ? String(ev.status).replace(/[^a-z]/gi, "") : "failed");
  var t = parseTs(ev.ts);
  var stamp = t === null ? "--:--" : (startTs === null ? clockText(t) : offsetText(t - startTs));
  var full = t === null ? "no timestamp on this event" : "at " + clockText(t) + " local time";
  return '<div class="' + cls + '"><span class="ts" title="' + esc(full) + '">' + esc(stamp) + "</span>" +
    '<span class="ty">' + esc(type) + "</span>" +
    '<span class="tx">' + esc(eventDetail(ev)) + "</span></div>";
}

function eventDetail(ev) {
  switch (ev.type) {
    case "run_start":
      return (ev.subject ? ev.subject + ", " : "") + (ev.total || 0) + " cases queued";
    case "case_start":
      return ev.title || "";
    case "case_end":
      return (ev.status || "?") + "  " + (ev.title || "") +
        (ev.duration_ms ? "  (" + duration(ev.duration_ms) + ")" : "") +
        (ev.message ? "  " + ev.message : "");
    case "run_end":
      return (ev.status || "?") + ", " + (ev.passed || 0) + " passed, " + (ev.failed || 0) + " failed";
    default:
      var rest = {};
      for (var k in ev) {
        if (Object.prototype.hasOwnProperty.call(ev, k) && k !== "ts" && k !== "type") rest[k] = ev[k];
      }
      return JSON.stringify(rest);
  }
}

/* --- Recent runs ---------------------------------------------------------- */

var RECENT_COPY = {
  tests: '<div class="empty">No finished test run is on record. Records appear here as soon as a ' +
    "harness writes one, so a run launched from any terminal, session, or workflow shows up whether " +
    "or not anyone was watching it.</div>",
  processing: '<div class="empty">No processing run is on record yet. These are the runs that build ' +
    "the product rather than check it: fetching a subject repository, analyzing it, enriching it, " +
    "bundling the viewer, deploying it, refreshing a demo. As soon as one of those harnesses writes " +
    "a run record into the runs directory shown at the foot of this page, its history appears here, " +
    "with the same expandable detail, coverage, and stall detection the test runs get.</div>"
};

function renderRecentSection(name, categoryRuns, uncategorised) {
  var runs = categoryRuns.filter(function (r) { return !r.live; });
  var body = document.getElementById("recent-body-" + name);
  document.getElementById("recent-count-" + name).textContent =
    runs.length ? runs.length + " on record" : "";

  renderIfChanged("recent-" + name, { runs: runs, open: expanded, un: uncategorised }, body,
    function (el) {
      if (!runs.length) {
        el.innerHTML = RECENT_COPY[name];
        return;
      }
      var note = uncategorised
        ? '<div class="clist-note"' + defAttr("category", "other") + ">" + uncategorised + " of these " +
          (uncategorised === 1 ? "runs carries" : "runs carry") + " no category in its record, so it " +
          "is listed here rather than dropped from the board. Its kind column says what it was.</div>"
        : "";
      var rows = runs.map(recentRow).join("");
      el.innerHTML =
        "<table><thead><tr>" +
        '<th class="caret"></th>' +
        "<th" + tipAttr("The run's own verdict, or the board's reading of a record that stopped being updated. Hover any status pill for what that particular word means.", true) + ">status</th>" +
        "<th" + tipAttr(TIP.kind, true) + ">kind</th>" +
        "<th" + tipAttr(TIP.subject, true) + ">subject</th>" +
        "<th" + tipAttr(TIP.when, true) + ">when</th>" +
        "<th" + tipAttr(TIP.duration, true) + ">duration</th>" +
        "<th" + tipAttr("Cases that passed and cases that failed, counted by the harness. Warnings and skips are added after them when there are any, because they are outcomes rather than failures.", true) + ">passed / failed</th>" +
        "<th" + tipAttr(TIP.foundCol, true) + ">found</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table>" + note;
    });
}

function recentRow(run) {
  var id = run.id || "";
  var open = !!expanded[id];
  var stalled = run.status === "stalled";
  var h = [];
  h.push('<tr class="run-row' + (open ? " is-open" : "") + (stalled ? " is-stalled" : "") +
    '" data-id="' + esc(id) + '">');
  h.push('<td class="caret"' + tipAttr("Click the row to open the full record: every case, every " +
    "message, the coverage the suite reported, and which versions produced it.") + ">" +
    (open ? "&#9662;" : "&#9656;") + "</td>");
  h.push("<td>" + statusPill(run.status) + "</td>");
  h.push('<td class="c-kind"><span' + defAttr("kind", run.kind) + ">" +
    esc(run.kind || "run") + "</span></td>");
  h.push('<td class="c-subject"' + tipAttr(TIP.subject) + ">" +
    esc(run.subject || "unknown subject") + "</td>");
  h.push('<td class="c-when"' + tipAttr(TIP.when) + ">" + relSpan(run.started_at) + "</td>");
  if (run.status === "stalled") {
    var silent = run.seconds_since_update;
    h.push('<td class="c-dur stall-age"' + defAttr("field", "seconds_since_update") + ">silent " +
      (silent === null || silent === undefined ? "for an unknown time" : esc(spanText(silent))) +
      "</td>");
  } else {
    h.push('<td class="c-dur"' + tipAttr(TIP.duration) + ">" + esc(runDuration(run)) + "</td>");
  }
  h.push('<td class="c-tally"><span class="tally-pass"' + tipAttr(TIP.tallyPass) + ">" +
    num(run.passed || 0) + "</span>" +
    ' <span style="color:var(--faint)">/</span> <span class="tally-fail"' + tipAttr(TIP.tallyFail) + ">" +
    num(run.failed || 0) + "</span>" +
    (warnCount(run) ? ' <span class="tally-warn"' + tipAttr(TIP.tallyWarn) + ">+" + warnCount(run) + " warned</span>" : "") +
    (run.skipped ? ' <span class="tally-skip"' + tipAttr(TIP.tallySkip) + ">+" + num(run.skipped) + " skipped</span>" : "") +
    "</td>");
  h.push(foundCell(run));
  h.push("</tr>");
  if (open) {
    h.push('<tr class="detail-row' + (stalled ? " is-stalled" : "") + '"><td colspan="8">' +
      runDetail(run) + "</td></tr>");
  }
  return h.join("");
}

function runDuration(run) {
  if (run.duration_ms) return duration(run.duration_ms);
  var start = parseTs(run.started_at);
  var end = parseTs(run.ended_at);
  if (start !== null && end !== null) return duration(end - start);
  return "n/a";
}

function runDetail(run) {
  var h = [];
  var v = run.versions || {};
  var ds = v.dataset || null;

  if (run.status === "stalled") {
    var age = run.seconds_since_update;
    h.push('<div class="stall-note"><b>Stalled.</b> This run still says it is running, but its ' +
      "record has not been touched for " +
      (age === null || age === undefined ? "an unknown time" : esc(spanText(age))) +
      ". The process most likely died, so treat the counts below as the last thing it managed to write.</div>");
  }

  h.push('<div class="detail-meta">');
  h.push("<span" + tipAttr(TIP.runId) + ">id <span class=\"val mono\">" + esc(run.id || "unknown") + "</span></span>");
  h.push("<span" + tipAttr(TIP.started) + ">started <span class=\"val\">" + relSpan(run.started_at) + "</span></span>");
  if (run.ended_at) {
    h.push("<span" + tipAttr("Ended: when the harness wrote its final record for this run.") +
      ">ended <span class=\"val\">" + relSpan(run.ended_at) + "</span></span>");
  }
  h.push("<span" + tipAttr(TIP.cases) + ">cases <span class=\"val\">" + num(run.completed || 0) +
    " of " + num(run.total || 0) + "</span></span>");
  if (run.budget) h.push("<span" + defAttr("field", "budget") + ">budget <span class=\"val\">" + esc(run.budget) + "</span></span>");
  if (run.base_url) h.push("<span" + defAttr("field", "base_url") + ">base url <span class=\"val mono\">" + esc(run.base_url) + "</span></span>");
  if (run.data_dir) h.push("<span" + defAttr("field", "data_dir") + ">data <span class=\"val mono path\">" + esc(run.data_dir) + "</span></span>");
  if (run.source_checked) {
    h.push("<span" + tipAttr(TIP.sourceChecked) + ">source <span class=\"val mono path\">" + esc(run.source_checked) + "</span></span>");
  }
  h.push("<span" + tipAttr("Built by: the viewer and analyzer versions the harness saw in the " +
    "checkout when it ran. Blank means the harness did not record them, which the lint does not.") +
    ">built by <span class=\"val\">viewer " + esc(v.viewer_version || "unknown") +
    ", analyzer " + esc(v.analyzer_version || "unknown") + "</span></span>");
  if (ds) {
    h.push("<span" + tipAttr("Dataset: the analyzer output this run read, with the analyzer that " +
      "produced it, its size, and the commit of the subject repository it was built from. " +
      (ds.subject_sha ? "Full subject commit: " + ds.subject_sha + "." : "")) +
      ">dataset <span class=\"val\">" + esc(ds.name || "unnamed") +
      ", analyzer " + esc(ds.analyzer_version || "unknown") +
      (ds.components ? ", " + num(ds.components) + " components" : "") +
      (ds.subject_sha ? ", subject " + esc(String(ds.subject_sha).slice(0, 9)) : "") +
      "</span></span>");
  }
  h.push("</div>");

  /* What the run found, before what the run concluded. The verdict is one
     word; this is the size and shape of the evidence behind it. */
  var ft = findingTotals(run);
  if (ft) {
    h.push('<div class="metrics issue-tote">');
    h.push(metric("instances found", num(ft.instances),
      ft.instances === 1 ? "one sighting in total" : "sightings in total", TIP.instances));
    h.push(metric("distinct problems", num(ft.distinct),
      ft.distinct === 1 ? "one problem, however many sightings" : "different problems", TIP.distinct));
    h.push(metric("errors", num(ft.errors),
      num(ft.errorInstances) + (ft.errorInstances === 1 ? " instance" : " instances"), TIP.severity));
    h.push(metric("warnings", num(ft.warnings),
      num(ft.warningInstances) + (ft.warningInstances === 1 ? " instance" : " instances"), TIP.severity));
    h.push("</div>");
    h.push('<div class="detail-meta">' + shapeTag(ft.instances, ft.distinct) + "</div>");
  }

  var cases = run.cases || [];
  if (!cases.length) {
    h.push('<div class="empty">This run recorded no cases. Either it died before the first case ' +
      "finished, or the harness wrote no case entries.</div>");
  } else {
    var failed = cases.filter(isBadCase);
    var warned = cases.filter(isWarnCase);
    var rest = cases.filter(function (c) { return !isBadCase(c) && !isWarnCase(c); });
    if (failed.length || warned.length) {
      if (failed.length) {
        h.push('<div class="detail-meta"><span class="tally-fail">' + failed.length +
          " failing " + (failed.length === 1 ? "case" : "cases") + " first</span></div>");
        h.push(failed.map(caseLine).join(""));
      }
      if (warned.length) {
        h.push('<div class="detail-meta"><span class="tally-warn">' + warned.length +
          " warning " + (warned.length === 1 ? "case" : "cases") + "</span></div>");
        h.push(warned.map(caseLine).join(""));
      }
      if (rest.length) {
        h.push('<div class="detail-meta"><span>' + rest.length + " other " +
          (rest.length === 1 ? "case" : "cases") + "</span></div>");
        h.push(rest.map(caseLine).join(""));
      }
    } else {
      h.push(cases.map(caseLine).join(""));
    }
  }

  var coverage = run.coverage || [];
  if (coverage.length) {
    h.push('<div class="cov-run"><b' + defAttr("field", "coverage") + ">Coverage reported by the suite</b>" +
      coverage.map(coverageLine).join("") + "</div>");
  }
  return h.join("");
}

/* A failure is a verdict the run cannot stand behind. A warning is a finding
   worth reading that did not fail the run, so it gets its own colour rather
   than being rounded up into red. */
function coverageLine(line) {
  var text = String(line);
  var at = text.indexOf(": ");
  if (at > 0 && at < 40) {
    return '<div class="covline"><span class="ck">' + esc(text.slice(0, at)) + "</span>" +
      '<span class="cv mono">' + esc(text.slice(at + 2)) + "</span></div>";
  }
  return '<div class="covline solo"><span class="cv">' + esc(text) + "</span></div>";
}

/* ----------------------------------------------------------------------------
 * Findings. A run that examined 188,841 citations and reported "1 failed, 2
 * warned" told the owner nothing about what it found. These helpers exist so
 * that never happens again: how many times something was found, and how many
 * different things were found, are rendered together and never collapsed.
 * -------------------------------------------------------------------------- */

function findingTotals(run) {
  var ft = run.finding_totals;
  if (!ft || typeof ft !== "object") return null;
  var instances = numberOr(ft.instances, null);
  var distinct = numberOr(ft.distinct, null);
  if (instances === null && distinct === null) return null;
  return {
    instances: instances === null ? 0 : instances,
    distinct: distinct === null ? 0 : distinct,
    errors: numberOr(ft.errors, 0),
    errorInstances: numberOr(ft.error_instances, 0),
    warnings: numberOr(ft.warnings, 0),
    warningInstances: numberOr(ft.warning_instances, 0)
  };
}

function numberOr(v, fallback) {
  return typeof v === "number" && isFinite(v) ? v : fallback;
}

/** The two counts read out loud. This is the sentence the owner asked for:
    fifty copies of one problem and fifty separate problems must never look
    alike, and nobody should have to do the division to tell them apart. */
function shapePhrase(instances, distinct) {
  if (!instances) return { text: "nothing found", cls: "" };
  if (distinct <= 1) {
    return instances === 1
      ? { text: "1 instance of 1 problem", cls: "" }
      : { text: num(instances) + " instances, all one problem", cls: "repeat" };
  }
  if (instances === distinct) {
    return { text: num(distinct) + " separate problems", cls: "spread" };
  }
  var per = instances / distinct;
  return {
    text: num(instances) + " instances across " + num(distinct) + " separate problems",
    cls: per >= 3 ? "repeat" : "spread"
  };
}

/** The same reading, short enough for a table cell. Empty when the two counts
    are both one, because there is no shape to describe. */
function shapeShort(instances, distinct) {
  if (!instances) return "";
  if (distinct <= 1) return instances === 1 ? "" : "all one problem";
  if (instances === distinct) return "all separate";
  return "about " + num(Math.round(instances / distinct)) + " each";
}

function shapeTag(instances, distinct) {
  var sp = shapePhrase(instances, distinct);
  return '<span class="shape ' + sp.cls + '"' + tipAttr(TIP.shape) + ">" + esc(sp.text) + "</span>";
}

/** The history table cell. Two labelled numbers, never one. */
function foundCell(run) {
  var ft = findingTotals(run);
  if (ft) {
    var hot = ft.errorInstances > 0 ? " err" : "";
    var short = shapeShort(ft.instances, ft.distinct);
    return '<td class="c-found"' + tipAttr(TIP.foundCol) + '><span class="found">' +
      '<span><span class="n' + hot + '">' + num(ft.instances) + '</span> ' +
      '<span class="lbl">' + (ft.instances === 1 ? "instance" : "instances") + "</span></span>" +
      '<span><span class="n">' + num(ft.distinct) + '</span> ' +
      '<span class="lbl">distinct</span></span>' +
      (short ? '<span class="lbl shp"' + tipAttr(TIP.shape) + ">" + esc(short) + "</span>" : "") +
      "</span></td>";
  }
  /* No finding detail from this harness. The case count is shown in its place,
     visibly softer, because a case count is not an instance count. */
  var cases = run.cases || [];
  var flagged = cases.filter(function (c) { return isBadCase(c) || isWarnCase(c); }).length;
  return '<td class="c-found"' + tipAttr(TIP.foundNone) + '><span class="found"><span class="soft">' +
    (flagged ? num(flagged) + (flagged === 1 ? " case" : " cases") : "no findings") +
    '</span><span class="lbl">not itemised</span></span></td>';
}

/** Instances and distinct beside a single case, when the case carries them. */
function caseInstanceBadge(c) {
  var instances = numberOr(c.instances, null);
  if (instances === null || instances === 0) return "";
  var distinct = numberOr(c.distinct, null);
  var text = num(instances) + (instances === 1 ? " instance" : " instances");
  if (distinct !== null) text += ", " + num(distinct) + " distinct";
  return '<span class="inst-badge"' + tipAttr(TIP.instances + " " + TIP.distinct) + ">" +
    esc(text) + "</span>";
}

function severityPill(severity) {
  var sv = String(severity || "unknown");
  var cls = sv === "error" ? "failed" : sv === "warn" ? "warned" : "neutral";
  return '<span class="pill ' + cls + '"' + tipAttr(TIP.severity) + ">" + esc(sv) + "</span>";
}

/* Nature is the "is it broken or just not built yet" answer, so it is louder
   than the severity beside it. Its definition comes from the payload. */
function naturePill(nature) {
  var n = String(nature || "unclassified");
  var cls = "pill nat nat-" + n.replace(/[^a-z]/gi, "");
  return "<span class=\"" + cls + "\"" + defAttr("nature", n) + ">" + esc(n) + "</span>";
}

function findingBlock(findings) {
  var list = findings || [];
  if (!list.length) return "";
  var h = ['<div class="findings">'];
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    var sev = String(f.severity || "");
    h.push('<div class="finding sev-' + (sev === "error" ? "error" : "warn") + '">');
    h.push('<div class="finding-head">');
    h.push(severityPill(f.severity));
    h.push(naturePill(f.nature));
    h.push('<span class="ftitle">' + esc(f.title || "untitled finding") + "</span>");
    var inst = numberOr(f.instances, null);
    if (inst !== null) {
      h.push('<span class="inst-badge"' + tipAttr(TIP.instances) + ">" + num(inst) +
        (inst === 1 ? " instance" : " instances") + "</span>");
    }
    h.push("</div>");
    if (f.rule) {
      h.push('<div class="frule"' + tipAttr("The check that reported this finding.") + ">rule " +
        esc(f.rule) + "</div>");
    }
    if (f.id) {
      h.push('<div class="fid"' + tipAttr(TIP.findingId) + ">" + esc(f.id) + "</div>");
    }
    /* A single example that is word for word the title tells nobody anything
       twice, and at five findings a case it buries the ones that do. */
    h.push(exampleBlock(dropEchoedExamples(f.examples, f.title), "examples"));
    h.push("</div>");
  }
  h.push("</div>");
  return h.join("");
}

function dropEchoedExamples(examples, title) {
  var list = examples || [];
  if (list.length === 1 && String(list[0]) === String(title)) return [];
  return list;
}

/** Up to five concrete sightings, in the harness's own words. */
function exampleBlock(examples, cls) {
  var list = examples || [];
  if (!list.length) return "";
  var h = ['<div class="' + cls + '"' + tipAttr(TIP.findings) + ">"];
  var shown = list.slice(0, 5);
  for (var i = 0; i < shown.length; i++) h.push("<div>" + esc(shown[i]) + "</div>");
  if (list.length > shown.length) {
    h.push('<div class="more">' + (list.length - shown.length) + " further " +
      (list.length - shown.length === 1 ? "example is" : "examples are") +
      " not carried in the record.</div>");
  }
  h.push("</div>");
  return h.join("");
}

function isBadCase(c) {
  return c.status === "failed" || c.status === "timedOut" || c.status === "interrupted";
}

function warnCount(run) {
  return (run.cases || []).filter(isWarnCase).length;
}

function isWarnCase(c) {
  return c.status === "warned";
}

function caseLine(c) {
  var bad = isBadCase(c);
  var warn = isWarnCase(c);
  var h = [];
  h.push('<div class="case' + (bad ? " bad" : warn ? " warn" : "") + '">');
  h.push('<div class="st">' + statusPill(c.status) + "</div>");
  h.push('<div class="ti">' + esc(c.title || "untitled case") + caseInstanceBadge(c));
  if ((bad || warn) && c.message) h.push('<div class="msg">' + esc(c.message) + "</div>");
  h.push(findingBlock(c.findings));
  if (c.coverage && c.coverage.length) {
    h.push('<div class="cov"' + defAttr("field", "coverage") + ">" +
      c.coverage.map(function (line) { return "<span>" + esc(line) + "</span>"; }).join("") +
      "</div>");
  }
  h.push("</div>");
  h.push('<div class="du"' + tipAttr(typeof c.duration_ms === "number" ? TIP.durReported : TIP.durNone) +
    ">" + esc(duration(c.duration_ms)) + "</div>");
  h.push("</div>");
  return h.join("");
}

document.addEventListener("click", function (event) {
  var row = event.target.closest ? event.target.closest("tr.run-row") : null;
  if (!row) return;
  var id = row.getAttribute("data-id");
  if (!id) return;
  if (expanded[id]) delete expanded[id];
  else expanded[id] = true;
  /* Force one rebuild of both histories, the poll cadence is unaffected. */
  renderKeys["recent-tests"] = null;
  renderKeys["recent-processing"] = null;
  hideTip();
  render();
});

/* --- Issues ---------------------------------------------------------------
 *
 * A run log answers "what happened". This answers "what is still wrong", which
 * is a different question and the one that survives the week. Issues are keyed
 * by a fingerprint of the kind of problem, so a thing seen in nine runs is one
 * row saying nine, not nine rows.
 * -------------------------------------------------------------------------- */

function renderIssues() {
  var payload = state.issues || {};
  var issues = payload.issues || [];
  var totals = payload.totals || {};
  var body = document.getElementById("issues-body");
  var open = numberOr(totals.open, issues.filter(function (i) { return i.state !== "closed"; }).length);
  document.getElementById("issues-count").textContent =
    issues.length ? open + " open of " + num(numberOr(totals.total, issues.length)) + " tracked" : "";

  renderIfChanged("issues", payload, body, function (el) {
    if (!issues.length) {
      el.innerHTML = '<div class="empty">No issue is on the books. Issues are raised from what runs ' +
        "actually find, so this stays empty until a check reports something. It is not a to do list " +
        "that anyone maintains by hand.</div>";
      return;
    }
    var h = [];

    h.push('<div class="metrics issue-tote">');
    h.push(metric("open", num(open), num(numberOr(totals.total, issues.length)) + " tracked in total",
      TIP.issuesPane));
    h.push(metric("unclassified", num(numberOr(totals.unclassified, 0)),
      "nobody has decided yet", TIP.unclassified));
    h.push(metric("errors", num(numberOr(totals.errors, 0)), "the rest are warnings", TIP.severity));
    h.push(metric("instances", num(numberOr(totals.instances, 0)),
      "sightings across every open issue", TIP.instances));
    h.push("</div>");

    /* The unclassified count leads, because an unclassified issue is one nobody
       has looked at hard enough to say what it is. */
    var unclassified = numberOr(totals.unclassified, 0);
    if (unclassified > 0) {
      h.push('<div class="unclassified-note"' + defAttr("nature", "unclassified") + "><b>" +
        num(unclassified) + " of " + num(open) + " open " + (open === 1 ? "issue" : "issues") +
        (unclassified === 1 ? " is" : " are") + " unclassified.</b> Nobody has yet decided " +
        "whether these are defects, surfaces that are simply not built yet, threshold judgements, " +
        "or facts about the subject rather than about our tool. Until that call is made, none of " +
        "them can be read as either safe or urgent.</div>");
    }

    h.push(issues.slice().sort(issueOrder).map(issueRow).join(""));

    if (payload.updated_at) {
      h.push('<div class="clist-note"' + tipAttr("When the issue ledger was last recomputed from " +
        "the run records.") + ">Ledger last rebuilt " + relative(payload.updated_at) + ".</div>");
    }
    el.innerHTML = h.join("");
  });
}

/** Open before closed, then the biggest problem first. */
function issueOrder(a, b) {
  var ao = a.state === "closed" ? 1 : 0;
  var bo = b.state === "closed" ? 1 : 0;
  if (ao !== bo) return ao - bo;
  var ai = numberOr(a.max_instances, numberOr(a.last_instances, 0));
  var bi = numberOr(b.max_instances, numberOr(b.last_instances, 0));
  if (ai !== bi) return bi - ai;
  return String(a.title || "").localeCompare(String(b.title || ""));
}

function issueRow(issue) {
  var sev = String(issue.severity || "");
  var closed = issue.state === "closed";
  var runs = issue.runs_seen || [];
  var last = numberOr(issue.last_instances, null);
  var peak = numberOr(issue.max_instances, null);
  var h = [];

  h.push('<div class="issue sev-' + (sev === "error" ? "error" : "warn") +
    (closed ? " closed" : "") + '">');

  h.push('<div class="issue-top">');
  h.push(severityPill(issue.severity));
  h.push(naturePill(issue.nature));
  if (issue.state) {
    h.push('<span class="pill ' + (closed ? "skipped" : "plain") + '"' + tipAttr(TIP.issueState) +
      ">" + esc(issue.state) + "</span>");
  }
  h.push('<span class="issue-title">' + esc(issue.title || "untitled issue") + "</span>");

  h.push('<span class="issue-right">');
  if (last !== null) {
    h.push('<span class="issue-seen"' + tipAttr(TIP.instances) + "><b>" + num(last) + "</b> " +
      (last === 1 ? "instance" : "instances") + "</span>");
  }
  if (peak !== null && last !== null && peak > last) {
    h.push('<span class="issue-seen"' + tipAttr(TIP.peak) + ">peak <b>" + num(peak) + "</b></span>");
  }
  h.push('<span class="issue-seen"' + tipAttr(TIP.runsSeen + (runs.length ? " Seen in: " +
    runs.join(", ") + "." : "")) + "><b>" + num(runs.length) + "</b> " +
    (runs.length === 1 ? "run" : "runs") + "</span>");
  if (issue.subject) {
    h.push('<span class="issue-seen"' + tipAttr(TIP.issueSubject) + ">" + esc(issue.subject) + "</span>");
  }
  if (issue.kind) h.push('<span class="pill plain"' + defAttr("kind", issue.kind) + ">" + esc(issue.kind) + "</span>");
  /* Filed or not filed is never left to inference. An unfiled issue exists on
     this board and nowhere else. */
  if (issue.github_issue) {
    h.push('<a class="pill filed" href="' + esc(issue.github_issue) + '" target="_blank" ' +
      'rel="noreferrer"' + tipAttr(TIP.filed) + ">filed</a>");
  } else {
    h.push('<span class="pill unfiled"' + tipAttr(TIP.unfiled) + ">not filed</span>");
  }
  h.push("</span></div>");

  /* The traceability thread: the fingerprint, and the run it first came from.
     Both are selectable, because both exist to be pasted somewhere. */
  h.push('<div class="issue-trace">');
  if (issue.rule) h.push("<span>rule <span class=\"sel\">" + esc(issue.rule) + "</span></span>");
  if (issue.id) {
    h.push("<span" + tipAttr(TIP.findingId) + ">id <span class=\"sel\">" + esc(issue.id) + "</span></span>");
  }
  if (issue.first_seen_run) {
    h.push("<span" + tipAttr(TIP.firstSeenRun) + ">first seen in <span class=\"sel\">" +
      esc(issue.first_seen_run) + "</span></span>");
  }
  if (issue.first_seen_at) h.push("<span>first " + relSpan(issue.first_seen_at) + "</span>");
  if (issue.last_seen_at) h.push("<span>last " + relSpan(issue.last_seen_at) + "</span>");
  h.push("</div>");

  if (issue.note) {
    h.push('<div class="issue-note"' + tipAttr("A note somebody recorded against this issue.") +
      ">" + esc(issue.note) + "</div>");
  }
  /* The title is already the first example, so examples only earn their space
     when there is more than one thing to see. */
  var examples = dropEchoedExamples(issue.examples, issue.title);
  if (examples.length > 1) h.push(exampleBlock(examples, "issue-ex"));

  h.push("</div>");
  return h.join("");
}

/* --- Demo fleet ----------------------------------------------------------- */

function renderFleet() {
  var fleet = state.fleet || [];
  var body = document.getElementById("fleet-body");
  var drifted = fleet.filter(function (d) { return d.analyzer_drift; }).length;
  document.getElementById("fleet-count").textContent =
    fleet.length
      ? fleet.length + " registered" + (drifted ? ", " + drifted + " drifted" : "")
      : "";

  renderIfChanged("fleet", { fleet: fleet, current: (state.versions || {}).analyzer_version },
    body, function (el) {
      if (!fleet.length) {
        el.innerHTML =
          '<div class="empty">No demos are registered. Registry entries live in ' +
          '<span class="mono">demos/registry</span>, and each one shows up here with its ' +
          "build provenance once it exists.</div>";
        return;
      }
      el.innerHTML = '<div class="fleet">' + fleet.map(demoCard).join("") + "</div>";
    });
}

function demoCard(d) {
  var current = (state.versions || {}).analyzer_version;
  var h = [];
  h.push('<div class="demo' + (d.analyzer_drift ? " drift" : "") + '">');

  h.push('<div class="demo-head">');
  h.push('<span class="demo-subject"' + tipAttr("The name of the subject repository this demo maps, " +
    "taken from its registry entry.") + ">" + esc(d.subject || d.slug || "unnamed demo") + "</span>");
  h.push('<span class="demo-slug mono"' + tipAttr("Slug: the demo's short identifier. It names its " +
    "registry file, its output directory, and is one of the keys the board joins runs on.") + ">" +
    esc(d.slug || "") + "</span>");
  h.push("</div>");

  h.push('<div class="demo-pills">');
  /* Each pill is a fleet field's value, so each one carries that field's
     definition from the payload. The negative states use the same definition:
     what "analyzed" means is exactly what "not analyzed" is the absence of. */
  if (d.track) h.push('<span class="pill plain"' + defAttr("fleet", "track") + ">" + esc(d.track) + " track</span>");
  if (d.cadence) h.push('<span class="pill plain"' + defAttr("fleet", "cadence") + ">" + esc(d.cadence) + "</span>");
  h.push(d.analyzed
    ? '<span class="pill passed"' + defAttr("fleet", "analyzed") + ">analyzed</span>"
    : '<span class="pill neutral"' + defAttr("fleet", "analyzed") + ">not analyzed</span>");
  if (d.bundle_built) h.push('<span class="pill passed"' + defAttr("fleet", "bundle_built") + ">bundle built</span>");
  else if (d.analyzed) h.push('<span class="pill neutral"' + defAttr("fleet", "bundle_built") + ">no bundle</span>");
  if (d.analyzed) {
    h.push(d.enriched
      ? '<span class="pill plain"' + defAttr("fleet", "enriched") + ">enriched</span>"
      : '<span class="pill plain"' + defAttr("fleet", "enriched") + ">deterministic</span>");
  }
  if (d.analyzer_drift) {
    h.push('<span class="pill drift"' + defAttr("fleet", "analyzer_drift",
      "Built with analyzer " + (d.built_with_analyzer || "unknown") + ", the checkout is " +
      (current || "unknown") + ".") + ">DRIFT</span>");
  }
  h.push("</div>");

  if (d.analyzed) {
    h.push('<div class="stats">');
    h.push(stat(d.components, "components", glossaryText("fleet", "components"), true));
    h.push(stat(d.files, "files", TIP.flFiles));
    h.push(stat(d.symbols, "symbols", TIP.flSymbols));
    h.push(stat(d.relationships, "relations", TIP.flRelations));
    h.push("</div>");
  }

  h.push('<dl class="kv">');
  h.push("<dt>subject sha</dt><dd>" +
    (d.subject_sha
      ? '<span class="mono sha"' + defAttr("fleet", "subject_sha", "Full value: " + d.subject_sha + ".") + ">" +
        esc(String(d.subject_sha).slice(0, 9)) + "</span>"
      : '<span' + defAttr("fleet", "subject_sha") + ">not fetched</span>") + "</dd>");
  if (d.head_at_analysis && d.head_at_analysis !== d.subject_sha) {
    h.push("<dt>head at analysis</dt><dd><span class=\"mono sha\"" +
      defAttr("fleet", "head_at_analysis", "Full value: " + d.head_at_analysis + ".") + ">" +
      esc(String(d.head_at_analysis).slice(0, 9)) + "</span></dd>");
  }
  h.push("<dt" + tipAttr(TIP.flFetched) + ">fetched</dt><dd>" +
    (d.fetched_at ? relSpan(d.fetched_at) : "never") + "</dd>");
  h.push("<dt" + tipAttr(TIP.flGenerated) + ">generated</dt><dd>" +
    (d.generated_at ? relSpan(d.generated_at) : "never") + "</dd>");
  h.push("<dt>built with</dt><dd><span" + defAttr("fleet", "built_with_analyzer") + ">analyzer " +
    esc(d.built_with_analyzer || "unknown") + "</span>" +
    (d.analyzer_drift ? ', checkout is <span class="mono">' + esc(current || "unknown") + "</span>" : "") +
    "</dd>");
  if (d.url) {
    h.push("<dt" + tipAttr(TIP.flUrl) + ">hosted at</dt><dd><a href=\"" + esc(d.url) +
      '" target="_blank" rel="noreferrer">' + esc(d.url) + "</a></dd>");
  }
  h.push("</dl>");

  if (d.last_run) {
    var r = d.last_run;
    h.push('<div class="lastrun"><span' + defAttr("fleet", "last_run") + ">last run</span> " + statusPill(r.status) +
      "<span" + defAttr("kind", r.kind) + ">" + esc(r.kind || "run") + "</span>" +
      "<span" + tipAttr(TIP.when) + ">" + relSpan(r.started_at) + "</span>" +
      '<span class="tally-pass"' + tipAttr(TIP.tallyPass) + ">" + num(r.passed || 0) + " passed</span>" +
      '<span class="tally-fail"' + tipAttr(TIP.tallyFail) + ">" + num(r.failed || 0) + " failed</span>" +
      (r.finding_totals ? shapeTag(numberOr(r.finding_totals.instances, 0),
        numberOr(r.finding_totals.distinct, 0)) : "") +
      "</div>");
  } else {
    h.push('<div class="lastrun"><span' + tipAttr(TIP.flNoRun) +
      ">No run on record has exercised this demo.</span></div>");
  }

  h.push("</div>");
  return h.join("");
}

function stat(value, label, tip, isDefinition) {
  return '<div class="stat"' + (isDefinition && tip ? ' data-def="1"' : "") + tipAttr(tip) +
    '><div class="n">' + num(value) + '</div><div class="k">' + esc(label) + "</div></div>";
}

/* --- Footer --------------------------------------------------------------- */

function renderFooter() {
  renderIfChanged("footer", { root: state.repo_root, runs: state.runs_dir },
    document.getElementById("footer"), function (el) {
      el.innerHTML =
        "<span" + tipAttr("The checkout this board is reading, and the source of every version " +
          "number in the header.") + '>repo <span class="path mono">' +
        esc(state.repo_root || "unknown") + "</span></span>" +
        '<span style="padding:0 6px">·</span>' +
        "<span" + tipAttr("The directory the board watches. Every harness writes one folder per run " +
          "here, holding run.json and events.jsonl. Point a harness elsewhere with the TESTBOARD_DIR " +
          "environment variable and the board follows it.") + '>run records <span class="path mono">' +
        esc(state.runs_dir || "unknown") + "</span></span>";
    });
}

/* --- Boot ----------------------------------------------------------------- */

initTabs();
poll();
setInterval(poll, POLL_MS);
setInterval(tick, 1000);
</script>
