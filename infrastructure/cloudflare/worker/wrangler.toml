name = "solution-explorer-api"
main = "src/index.ts"
compatibility_date = "2024-06-20"

[[d1_databases]]
binding = "DB"
database_name = "solution-explorer-db"
database_id = "REPLACE_AFTER_D1_CREATION"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "solution-explorer-data"

[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "REPLACE_AFTER_KV_CREATION"

[vars]
WORKER_VERSION = "1.0.0"

# Secrets (set via `wrangler secret put`):
# INGEST_TOKEN  - Bearer token for /ingest and POST /settings
# WEBHOOK_SECRET - GitHub webhook HMAC secret
