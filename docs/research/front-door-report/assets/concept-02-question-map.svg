  <text x="638" y="426" class="s ink" font-size="30" font-weight="750">The core experience is a real-time learning loop</text><text x="638" y="464" class="s muted small">A learner speaks, the voice layer detects and transcribes, curriculum context is</text><text x="638" y="488" class="s muted small">added, an LLM creates the response, and speech services play it back.</text>
